[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-sgp-ms-etl"
version = "0.1.0"
description = "Microservico ETL Django para sincronizacao e auditoria do SGP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SME" }]
dependencies = [
  "Django>=5.1,<6",
  "djangorestframework>=3.15,<4",
  "drf-spectacular>=0.27,<1",
  "celery[redis]>=5.4,<6",
  "psycopg[binary]>=3.2,<4",
  "watchdog>=4.0,<5",
  "pyodbc>=5.1,<6",
]

[project.optional-dependencies]
dev = [
  "black>=24.8,<25",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "coverage>=7.6,<8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D"]
ignore = ["D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
